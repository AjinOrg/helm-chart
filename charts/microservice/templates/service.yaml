apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  type: ClusterIP # reachable only inside the cluster; the internet comes in through the Ingress (ALB)
  selector:
    {{- include "microservice.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
