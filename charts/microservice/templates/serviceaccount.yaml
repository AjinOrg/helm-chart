apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: pods using this service account get short-lived credentials for this role
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
# Services do not call the Kubernetes API: no API token in the pod (IRSA uses its own token)
automountServiceAccountToken: false
