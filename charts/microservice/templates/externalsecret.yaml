{{- if .Values.secrets.enabled }}
# Copies the Secrets Manager entry (JSON) into a Kubernetes Secret named like the service: one key per JSON field.
# The value lives only in AWS; this file holds only its name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.storeName }}
  target:
    name: {{ include "microservice.name" . }}
    creationPolicy: Owner # the Secret is deleted together with this ExternalSecret
  dataFrom:
    - extract:
        key: {{ include "microservice.secretsManagerKey" . }}
{{- end }}
